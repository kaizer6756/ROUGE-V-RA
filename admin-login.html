<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | ROUGE VÈRA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="preloader">
        <div class="preloader-content">
            <div class="perfume-bottle"><div class="bottle"></div><div class="liquid"></div></div>
            <h3 class="text-gold">ROUGE VÈRA</h3>
            <p class="text-muted">Loading Admin Authentication...</p>
        </div>
    </div>

    <nav class="navbar">
        <div class="container flex-between">
            <a href="index.html" class="nav-logo"><i class="fas fa-crown"></i><span>ROUGE VÈRA</span></a>
            <div class="nav-links">
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="shop.html" class="nav-link"><i class="fas fa-store"></i> Shop</a>
                <a href="login.html" class="nav-link"><i class="fas fa-sign-in-alt"></i> Customer Login</a>
            </div>
            <div class="nav-icons">
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            </div>
            <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    </nav>

    <section class="shop-header">
        <div class="container">
            <div class="shop-header-content">
                <h1>Admin <span class="text-gold">Authenticator</span></h1>
                <p class="text-muted">Sign in with your administrator credentials</p>
            </div>
        </div>
    </section>

    <section class="section">
        <div class="container">
            <div style="max-width: 420px; margin: 0 auto; background: #1a1a1a; padding: 40px; border-radius: 10px; border: 1px solid rgba(255, 215, 0, 0.2);">
                <form id="adminLoginForm">
                    <h2 style="color: #FFD700; text-align: center; margin-bottom: 30px;"><i class="fas fa-shield-alt"></i> Admin Login</h2>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="adminEmail">Admin Email</label>
                        <input type="email" id="adminEmail" required autocomplete="username" placeholder="admin@rougevera.com">
                    </div>
                    <div class="form-group" style="margin-bottom: 25px;">
                        <label for="adminPassword">Admin Password</label>
                        <input type="password" id="adminPassword" required autocomplete="current-password" placeholder="Enter admin password">
                    </div>
                    <button type="submit" class="btn btn-gold" style="width: 100%; padding: 15px;">
                        <i class="fas fa-lock"></i> Authenticate
                    </button>
                </form>
                <p style="text-align: center; margin: 25px 0 0; color: #888;">
                    <a href="login.html" style="color: #FFD700;">Return to customer login</a>
                </p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 ROUGE VÈRA. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
